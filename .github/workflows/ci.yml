name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ci-dummy-key
      GROQ_API_KEY: ci-dummy-key

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (clean, from pyproject.toml)
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-asyncio httpx ruff

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -v

      - name: Import smoke test
        run: python -c "from api.index import app; print('imports OK')"
