[project]
name = "portfolio-rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "pydantic",
    "pydantic-settings",
    "openai"
]

[tool.vercel]
entrypoint = "api.index:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not integration'"
markers = [
    "integration: calls real external APIs (run explicitly with -m integration)",
]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["rag*", "api"] 